defaults:
  - launcher: local
  - solver: fast_jepa
  - _self_

world:
  env_name: swm/PushT-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ???

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio
    - state

seed: 42
policy: random
sdpa_backend: math

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5


eval:
  num_eval: 100
  goal_offset_steps: 25
  eval_budget: 50
  episode_manifest: null
  episode_split: test
  img_size: 224
  dataset_name: pusht_expert_train
  protocol: official
  inference_mode: guarded_a
  callables:

    - method: _set_state
      args:
        state:
          value: state

    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

output:
  filename: pusht_results.txt
